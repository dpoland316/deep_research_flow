[project]
name = "deep_research_flow"
version = "0.1.0"
description = "deep_research_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.15.19,<2.0.0",
    "tavily-python>=0.5.0"
]

[project.scripts]
kickoff = "deep_research_flow.main:kickoff"
run_crew = "deep_research_flow.main:kickoff"
plot = "deep_research_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "042fa8e9-e02d-44d1-98d5-b4eb8891a222"
